name: Docs

# Builds the docs site, and deploys it to GitHub Pages from main only. The github-pages environment
# allows main only (.github/environments/github-pages.json), so no other ref can deploy even if this
# file changes.
#
# The build is also the library's browser check. The library has no bundler of its own. The site
# bundles the interactive pages from the library's sources, and docs/site/browser-only.ts fails the
# build when browser code imports a Node built-in.
#
# `docs build` can be a required check, so the workflow runs on every pull request, with no path
# filter: a check that a path filter skips never reports, and the pull request waits for it. The
# build takes about a minute.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # No dependency cache: this job produces what the deploy job publishes.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # The build fails on a broken internal link (starlight-links-validator) and builds the
      # Pagefind index.
      - run: pnpm run docs:build
      # A pull request's site can be downloaded from the run for 7 days.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site/dist
          retention-days: 7

  deploy:
    name: deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
