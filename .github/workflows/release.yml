name: Release

# A release is an immutable GitHub release `v0.<minor>.<patch>` with one attested tarball of the
# package, its SBOM and SHA256SUMS (decision 0021). A maintainer starts it by hand, on main, with the
# tag. No pushed tag starts a release: the release job creates the tag on the released commit.
#
# - The build job has read access only. It checks that the commit is on main and that the tag is
#   new and greater than every v* tag, runs the checks, and assembles the build tree with the tag's
#   version stamped into its package.json. It runs the package checks and the consumer test on
#   exactly that tree, packs it once, and writes the SBOM, the checksums and the notes.
# - The release job runs no repository code and has no environment, deploy key or checkout. It
#   attests the tarball's build provenance and its SBOM with the workflow's identity, then creates
#   the tag and publishes the release with the workflow token.
# - The verify job downloads the tarball from the release as a consumer does, verifies its
#   attestation by this workflow on main, installs it with zod and runs its bin.
#
# The attestation is the control: only this workflow, run on main, signs one that passes
# `gh attestation verify --signer-workflow … --source-ref refs/heads/main`. The workflow relies on
# two repository settings that no pull request can change: immutable releases, and the `v*` tag
# rulesets. MAINTAINERS.md § Releases has the procedure, and § Repository settings the settings.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, v0.<minor>.<patch>, greater than every v* tag. The workflow creates it."
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      # Every tag and the whole history: the tag check and the notes read them with git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # A release restores no cache, so that no other run's files can enter it.
          package-manager-cache: false
      - name: The commit is on main
        run: node scripts/check-on-main.ts "$GITHUB_REF" "$GITHUB_SHA"
      - name: The tag is new and greater than every v* tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          node scripts/check-release-tag.ts "$TAG"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      # main's package.json keeps 0.0.0. The tag's version goes into the shipped package.json only.
      - name: Assemble the build tree at the tag's version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: node scripts/build-package.ts "$RUNNER_TEMP/tree" --source-commit "$GITHUB_SHA" --version "$VERSION"
      - name: The packed tree passes publint and attw
        run: node scripts/check-package.ts "$RUNNER_TEMP/tree"
      - name: The consumer test passes on exactly this tree
        run: node scripts/build-consumer.ts --tree "$RUNNER_TEMP/tree"
      - name: Pack the tree once
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        working-directory: ${{ runner.temp }}/tree
        run: |
          pnpm pack --pack-destination "$GITHUB_WORKSPACE/release"
          test -f "$GITHUB_WORKSPACE/release/hephaestus-build-ichnaea-$VERSION.tgz"
      - name: SBOM of what the tarball installs, with its download URL on the release
        env:
          TAG: ${{ inputs.tag }}
        run: |
          node scripts/release-sbom.ts release release/sbom.cdx.json "$TAG"
          node scripts/check-sbom.ts release/sbom.cdx.json release "$TAG"
      - name: Checksums
        working-directory: release
        run: sha256sum -- *.tgz sbom.cdx.json > SHA256SUMS
      - name: Release notes
        env:
          TAG: ${{ inputs.tag }}
        run: node scripts/release-notes.ts "$TAG" "$GITHUB_SHA" > release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            release/
            release-notes.md
          if-no-files-found: error
          retention-days: 7

  release:
    name: attest, tag and publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the GitHub release
      id-token: write # sign the attestations with the workflow's identity
      attestations: write # store the attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: The files are the ones that the build job checked
        working-directory: release
        run: sha256sum --check --strict SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.tgz
      - name: Attest the SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.tgz
          sbom-path: release/sbom.cdx.json
      # gh creates a draft, uploads the files and then publishes it, so that the immutable release
      # has every file. Publishing creates the tag at --target. If the tag exists, gh would release
      # it wherever it points, so the job refuses an existing tag and checks the new one after.
      - name: Create the tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          remote="https://github.com/$GH_REPO.git"
          if [ -n "$(git ls-remote "$remote" "refs/tags/$TAG")" ]; then
            echo "::error::The tag $TAG exists already. A release creates its own tag."
            exit 1
          fi
          gh release create "$TAG" "release/hephaestus-build-ichnaea-$VERSION.tgz" \
            release/sbom.cdx.json release/SHA256SUMS \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file release-notes.md
          tagged="$(git ls-remote "$remote" "refs/tags/$TAG" | cut -f 1)"
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::The tag $TAG names ${tagged:-nothing}, not the released commit $GITHUB_SHA."
            exit 1
          fi

  verify:
    name: verify the published release
    needs: [build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read # read the tarball's attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Download the tarball from the release, as a consumer does
        env:
          TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir "$RUNNER_TEMP/download"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$RUNNER_TEMP/download/hephaestus-build-ichnaea-$VERSION.tgz" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/hephaestus-build-ichnaea-$VERSION.tgz"
      - name: The attestation names this workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh attestation verify "$RUNNER_TEMP/download/hephaestus-build-ichnaea-$VERSION.tgz" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref refs/heads/main --deny-self-hosted-runners
      - name: The tarball installs with zod and its bin prints the tag's version
        env:
          TAG: ${{ inputs.tag }}
        run: node scripts/tarball-project.ts "$RUNNER_TEMP/download" "$TAG"
