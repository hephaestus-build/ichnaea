name: Release finish

# Finishes a release after a package owner approved its staged version on npmjs.com (decision
# 0021). release.yml staged the version; this workflow publishes nothing to npm. A maintainer
# starts it by hand with the tag, or the daily run finds every v* tag whose version npm lists as
# published and that has no GitHub release yet.
#
# Every job checks out the default branch, never the tag: this workflow runs no code of the
# version that it checks, only that version as npm serves it, in a scratch project.
#
# - The pending job finds those tags.
# - The verify job, one per tag, finds the release run of the tag by the tag's commit and
#   downloads the files that it staged. It checks that npm serves the version with the staged
#   SHA-512, that a new npm project installs it with valid signatures, and that its provenance
#   names release.yml at the tag and the tag's commit, which is on main. It checks that the bin
#   prints the version and that the README's install and example run against it. Then it records
#   the run as verified.
# - The release job, one per tag, runs no repository code. It needs the tag's verified record, so a
#   tag that failed its checks gets no release and the others still do. It checks the files
#   against SHA256SUMS, hashes each tarball and compares it with npm's integrity, and creates the
#   GitHub release on the existing tag with the notes, the tarball, the SBOM and SHA256SUMS.
#
# MAINTAINERS.md § Releases has the procedure.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The v* tag whose approved version to finish. Empty: every pending tag."
        required: false
        type: string
  schedule:
    - cron: "17 6 * * *"

permissions: {}

concurrency:
  group: release-finish
  cancel-in-progress: false

jobs:
  pending:
    name: pending releases
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.pending.outputs.tags }}
    steps:
      # Every tag: the job reads them with git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: The tags whose version is on npm and that have no GitHub release
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: node scripts/release-pending.ts "$TAG" >> "$GITHUB_OUTPUT"

  verify:
    name: verify ${{ matrix.tag }}
    needs: pending
    if: needs.pending.outputs.tags != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read # find the release run and download its artifact
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        tag: ${{ fromJSON(needs.pending.outputs.tags) }}
    steps:
      # main's scripts, every tag, and the history for the check that the tag's commit is on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --filter '!ichnaea-docs'
      - name: The release run of the tag, by the tag's commit
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ matrix.tag }}
        run: node scripts/release-run.ts "$TAG" >> "$GITHUB_OUTPUT"
      - name: Download the files that the release run staged
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ steps.run.outputs.run }}
        run: gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n release -D "$RUNNER_TEMP/release"
      - name: npm serves the staged tarball, with valid signatures and its provenance
        env:
          TAG: ${{ matrix.tag }}
        run: |
          INTEGRITY="$(cat "$RUNNER_TEMP/release/integrity")"
          node scripts/verify-published.ts "$TAG" "$INTEGRITY"
      - name: The README's install and example run against the published version
        env:
          TAG: ${{ matrix.tag }}
        run: |
          VERSION="${TAG#v}"
          node scripts/build-consumer.ts --spec "@tumaet/ichnaea@$VERSION"
      - name: Record the verified run
        env:
          RUN: ${{ steps.run.outputs.run }}
        run: |
          mkdir "$RUNNER_TEMP/verified"
          printf '%s\n' "$RUN" > "$RUNNER_TEMP/verified/run"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-${{ matrix.tag }}
          path: ${{ runner.temp }}/verified/
          if-no-files-found: error
          retention-days: 1

  release:
    name: release ${{ matrix.tag }}
    needs: [pending, verify]
    # A failed verify of one tag skips the release of that tag alone: its record is missing.
    if: ${{ !cancelled() && needs.pending.result == 'success' && needs.pending.outputs.tags != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the GitHub release
      actions: read # download the artifact of the release run
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        tag: ${{ fromJSON(needs.pending.outputs.tags) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-${{ matrix.tag }}
          path: verified
      - name: Download the files of the verified release run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$(cat verified/run)" -R "$GITHUB_REPOSITORY" -n release -D release
      - name: The files are the ones that the release run checked
        working-directory: release/assets
        run: sha256sum --check --strict SHA256SUMS
      - name: Each tarball is the one that npm serves
        env:
          TAG: ${{ matrix.tag }}
        run: |
          VERSION="${TAG#v}"
          registry="$(npm view "@tumaet/ichnaea@$VERSION" dist.integrity)"
          count=0
          for tgz in release/assets/*.tgz; do
            actual="sha512-$(openssl dgst -sha512 -binary "$tgz" | base64 -w0)"
            if [ "$actual" != "$registry" ]; then
              echo "::error::$tgz has $actual, but npm serves $VERSION with $registry."
              exit 1
            fi
            count=$((count + 1))
          done
          if [ "$count" -ne 1 ]; then
            echo "::error::The release would carry $count tarballs, not one."
            exit 1
          fi
      - name: Create the GitHub release on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ matrix.tag }}
        run: |
          prerelease=()
          if [ "$(cat release/dist-tag)" = next ]; then prerelease=(--prerelease); fi
          gh release create "$TAG" release/assets/*.tgz release/assets/sbom.cdx.json \
            release/assets/SHA256SUMS --verify-tag --title "$TAG" \
            --notes-file release/release-notes.md "${prerelease[@]}"
