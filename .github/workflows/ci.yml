name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The oracle images, written name:tag@digest so that an update tool can read the version. The
# digest is what runs; the tag only names it.
env:
  R_IMAGE: rocker/r-ver:4.5.2@sha256:fd4ccdd3a4a6f7ef805e2daeee2a0fe3bf126bc231f36351223baecf5a595a4c
  PYTHON_IMAGE: python:3.13.18-slim@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run check:generated
      - name: The contracts' API report is current
        run: pnpm run check:api
      # Releases are paused (release.yml); the SBOM of the packed tarballs stays checked. With no
      # tag, the SBOM's download URLs name the placeholder tag `untagged`, and the check expects it.
      - name: The release SBOM of the packed tarballs lists what they ship
        run: |
          pnpm -r --filter './packages/*' exec pnpm pack --pack-destination "$RUNNER_TEMP/tarballs"
          node scripts/release-sbom.ts "$RUNNER_TEMP/tarballs" "$RUNNER_TEMP/sbom.cdx.json"
          node scripts/check-sbom.ts "$RUNNER_TEMP/sbom.cdx.json" "$RUNNER_TEMP/tarballs"

  # The packages ship TypeScript sources, which Node 24 runs with its type stripping: no build, no
  # loader.
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The floor that every package names in `engines`, and the current Node 24.
        node: ["24.3.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: The CLI runs from the sources
        run: node packages/ichnaea/src/core/bin.ts --version
      # A real submodule that stays clean after install, the public API under each consumer compiler
      # profile, and the README's example.
      - name: A consumer with Ichnaea as a git submodule installs, type-checks and runs it with Node
        run: node scripts/submodule-consumer.ts

  simulation:
    name: simulation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Coverage and type-I error studies (6,000 repetitions per point)
        env:
          ICHNAEA_SIM_REPS: "6000"
        run: pnpm --filter @hephaestus-build/ichnaea run test:sim:stats
      - name: False REGRESSION verdicts of the decision rule under no change (REQ-51)
        run: pnpm --filter @hephaestus-build/ichnaea run test:sim:decide

  oracle:
    name: oracle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The checkout is mounted read-only: the oracle reads the vectors and cannot change them.
      - name: Digest vectors match an implementation in another language
        run: |
          docker run --rm -v "$PWD":/w:ro -w /w "$PYTHON_IMAGE" sh -c \
            "pip install --quiet --root-user-action=ignore --require-hashes \
            -r packages/ichnaea/scripts/contracts/oracle/requirements.txt \
            && python packages/ichnaea/scripts/contracts/oracle/verify_vectors.py packages/ichnaea/fixtures"

  stats-oracle:
    name: stats oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # numpy, mpmath and R rerun as test-only oracles in pinned images, and the coefficients are
      # read again from R's source. A committed reference file that its script no longer produces
      # fails the job.
      - name: The stats reference values are what their oracles write
        working-directory: packages/ichnaea
        run: |
          docker run --rm -v "$PWD":/w -w /w "$R_IMAGE" Rscript scripts/stats/reference-normal.R
          docker run --rm -v "$PWD":/w -w /w "$PYTHON_IMAGE" sh -c \
            "pip install --quiet --root-user-action=ignore --require-hashes -r scripts/stats/oracle-requirements.txt \
            && python scripts/stats/reference-mt19937.py && python scripts/stats/reference-normal-mpmath.py"
          node scripts/stats/reference-normal-coefficients.ts
          git diff --exit-code -- test/stats/reference-r-normal.json test/stats/reference-numpy-mt19937.json \
            test/stats/reference-mpmath-normal.json test/stats/reference-normal-coefficients.json
      # The score permutation test's tables, and its two oracles: coin, and an exact enumeration in
      # Python that was written from the formulas alone and checks itself first.
      - name: The score permutation reference values are what their oracles write
        working-directory: packages/ichnaea
        run: |
          node scripts/stats/score-permutation-tables.ts
          docker run --rm -v "$PWD":/w -w /w "$R_IMAGE" Rscript scripts/stats/reference-score-permutation.R
          docker run --rm -v "$PWD":/w -w /w "$PYTHON_IMAGE" sh -c \
            "pip install --quiet --root-user-action=ignore --require-hashes -r scripts/stats/oracle-requirements.txt \
            && python scripts/stats/score_permutation_oracle_test.py \
            && python scripts/stats/score_permutation_oracle.py test/stats/reference-score-permutation-tables.json \
               test/stats/reference-python-score-permutation.json"
          git diff --exit-code -- test/stats/reference-score-permutation-tables.json \
            test/stats/reference-coin-score-permutation.json test/stats/reference-python-score-permutation.json

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint (with shellcheck) and zizmor run in pinned images, offline, with no token.
      - name: Workflows lint clean and pass the security audit
        env:
          ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.32.0@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d
        run: |
          docker run --rm -v "$PWD":/w -w /w "$ACTIONLINT_IMAGE" -color
          docker run --rm -v "$PWD":/w -w /w "$ZIZMOR_IMAGE" --offline .github/workflows

  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Conventional commit titles
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE" --to "$HEAD"

  ok:
    name: ok
    if: always()
    needs: [check, test, simulation, oracle, stats-oracle, workflows, commits]
    runs-on: ubuntu-slim
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a required job ended with $r"; exit 1 ;; esac
          done
