name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The oracle images, written name:tag@digest so that an update tool can read the version. The
# digest is what runs; the tag only names it.
env:
  R_IMAGE: rocker/r-ver:4.5.2@sha256:fd4ccdd3a4a6f7ef805e2daeee2a0fe3bf126bc231f36351223baecf5a595a4c
  PYTHON_IMAGE: python:3.13.18-slim@sha256:e48f59cdba69a3cbd9ed2cf0f348d90d45a8d350d98134cf1070bc106ee9ed90

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run check:generated
      - name: Package correctness (publint, are the types wrong)
        run: pnpm run check:package

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  simulation:
    name: simulation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Coverage and type-I error studies (6,000 repetitions per point)
        env:
          ICHNAEA_SIM_REPS: "6000"
        run: pnpm --filter ./packages/stats run test:sim

  oracle:
    name: oracle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The checkout is mounted read-only: the oracle reads the vectors and cannot change them.
      - name: Digest vectors match an implementation in another language
        run: |
          docker run --rm -v "$PWD":/w:ro -w /w "$PYTHON_IMAGE" sh -c \
            "pip install --quiet --root-user-action=ignore --require-hashes \
            -r packages/contracts/scripts/oracle/requirements.txt \
            && python packages/contracts/scripts/oracle/verify_vectors.py packages/contracts/fixtures"

  stats-oracle:
    name: stats oracle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # numpy, mpmath and R rerun as test-only oracles in pinned images, and the coefficients are
      # read again from R's source. A committed reference file that its script no longer produces
      # fails the job.
      - name: The stats reference values are what their oracles write
        working-directory: packages/stats
        run: |
          docker run --rm -v "$PWD":/w -w /w "$R_IMAGE" Rscript scripts/reference-normal.R
          docker run --rm -v "$PWD":/w -w /w "$PYTHON_IMAGE" sh -c \
            "pip install --quiet --root-user-action=ignore --require-hashes -r scripts/oracle-requirements.txt \
            && python scripts/reference-mt19937.py && python scripts/reference-normal-mpmath.py"
          node scripts/reference-normal-coefficients.ts
          git diff --exit-code -- test/reference-r-normal.json test/reference-numpy-mt19937.json \
            test/reference-mpmath-normal.json test/reference-normal-coefficients.json

  commits:
    name: commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Conventional commit titles
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE" --to "$HEAD"

  ok:
    name: ok
    if: always()
    needs: [check, test, simulation, oracle, stats-oracle, commits]
    runs-on: ubuntu-slim
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "a required job ended with $r"; exit 1 ;; esac
          done
